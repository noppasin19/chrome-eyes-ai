<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Chrome Monitor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #059669;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .card-value {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      word-break: break-all;
    }
    .status-box {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
      animation: pulse-anim 2s infinite;
    }
    @keyframes pulse-anim {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="pulse"></span>
      Antigravity Bridge
    </div>
    <span class="badge" id="badge">v2.0.0</span>
  </div>

  <div class="card">
    <div class="card-title">แท็บที่กำลังเปิด (Active Tab)</div>
    <div class="card-value" id="tabTitle">กำลังโหลด...</div>
    <div class="card-title" style="margin-top: 8px;">URL</div>
    <div class="card-value" id="tabUrl" style="font-size: 11px; color: #94a3b8;">-</div>
  </div>

  <div class="card">
    <div class="card-title">โหมดการเชื่อมต่อ</div>
    <div class="status-box" id="status">
      WebSocket Local Bridge (ws://127.0.0.1:8765)
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
